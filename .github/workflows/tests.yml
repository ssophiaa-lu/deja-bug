name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Fake values so imports work. Tests never query Mongo or call GitHub,
      # and MongoClient doesn't connect until the first query.
      MONGODB_URI: mongodb://localhost:27017
      GITHUB_TOKEN: not-a-real-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -v

  # Runs alongside the Python tests. The build fails on any TypeScript error.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci  # installs exactly what package-lock.json lists
      - run: npm run lint
      - run: npm run build
