name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Fake values so imports work. Tests never query Mongo or call GitHub,
      # and MongoClient doesn't connect until the first query.
      MONGODB_URI: mongodb://localhost:27017
      GITHUB_TOKEN: not-a-real-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -v
